name: Docker CI

on:
  push:
    branches: [main, develop]
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - docker-compose.yml
      - docker-compose.prod.yml
      - .github/workflows/docker-ci.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - docker/**
      - docker-compose.yml
      - docker-compose.prod.yml
      - .github/workflows/docker-ci.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-and-runtime:
    name: Compose, build and health checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate development compose
        run: docker compose config --quiet

      - name: Validate production compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build backend development image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: development
          push: false
          load: true
          tags: hmn-agri-trade-erp-backend:latest
          cache-from: type=gha,scope=backend-development
          cache-to: type=gha,mode=max,scope=backend-development

      - name: Build frontend development image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: development
          push: false
          load: true
          tags: hmn-agri-trade-erp-frontend:latest
          cache-from: type=gha,scope=frontend-development
          cache-to: type=gha,mode=max,scope=frontend-development

      - name: Start application stack
        run: docker compose up -d --no-build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/health/live > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Verify frontend response
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:5173/

      - name: Verify service status
        run: docker compose ps

      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
