name: hmn-agri-trade-erp-production

services:
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [hmn-network]

  mongo-init:
    image: mongo:7.0
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ['bash', '/docker-entrypoint-initdb.d/init-replica.sh']
    volumes:
      - ./docker/mongo-init/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    networks: [hmn-network]

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hmn-network]

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${MONGO_DATABASE:-hmn_agri_trade}?replicaSet=rs0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-60}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-20}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-0}
      MONGO_SLOW_QUERY_MS: ${MONGO_SLOW_QUERY_MS:-250}
      CLIENT_URL: ${PUBLIC_APP_URL}
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
      - backend-backups:/app/backups
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/api/v1/health/live']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [hmn-network]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks: [hmn-network]

volumes:
  mongo-data:
  redis-data:
  backend-logs:
  backend-uploads:
  backend-backups:

networks:
  hmn-network:
    driver: bridge
